# ── ElimuTrack — Fly.io configuration ──
# 1) fly launch --no-deploy --region <your-region>
# 2) create + attach Postgres (see README → Fly.io)
# 3) fly secrets set JWT_SECRET=...
# 4) fly deploy

app = "elimutrack"
primary_region = "nbo"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    grace_period = "15s"
    interval = "30s"
    method = "get"
    path = "/api/health"
    timeout = "5s"
